<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Periodic Table Flash Cards</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 16px;
      background: white;
      color: black;

      overscroll-behavior: none;
    }

    .top-bar {
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .top-bar select {
      width: auto;
      max-width: 33vw;
      flex: 0 1 auto;
      white-space: nowrap;
    }

    .container {
      max-width: 420px;
      margin: auto;
      text-align: center;
    }

    h1 {
      margin-bottom: 18px;
      font-size: 2rem;
    }

    .card {
      position: relative;

      border: 4px solid rgba(0,0,0,0.12);
      border-radius: 22px;

      min-height: 420px;

      padding: 24px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      transition:
        background-color 0.25s ease,
        transform 0.12s ease;

      user-select: none;
      touch-action: pan-y;

      cursor: pointer;
    }

    .card:active {
      transform: scale(0.99);
    }

    .atomic-number {
      position: absolute;
      top: 18px;
      left: 18px;

      font-size: 1.4rem;
      font-weight: bold;
    }

    .mass {
      position: absolute;
      top: 18px;
      right: 18px;

      font-size: 1rem;
    }

    .symbol {
      font-size: 5.5rem;
      font-weight: bold;
      line-height: 1;

      margin-bottom: 16px;
    }

    .name {
      font-size: 2rem;
    }

    .name-zh {
      margin-top: 8px;
      font-size: 1.5rem;
      color: rgba(0,0,0,0.75);
      text-decoration: none;
    }

    .name-zh:hover {
      /* text-decoration: underline; */
    }

    .classification {
      position: absolute;
      bottom: 18px;

      font-size: 1rem;
      opacity: 0.75;

      text-transform: capitalize;
    }

    .hidden-info {
      visibility: hidden;
    }

    .buttons {
      margin-top: 18px;

      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button,
    select {
      font-size: 1rem;
      padding: 14px 16px;

      border-radius: 14px;
      border: 1px solid rgba(0,0,0,0.15);

      background: white;
    }

    button {
      font-weight: bold;
    }

    .popup {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);

      background: rgba(0,0,0,0.88);
      color: white;

      padding: 14px 18px;
      border-radius: 14px;

      font-size: 0.95rem;
      text-align: center;

      opacity: 0;
      pointer-events: none;

      transition: opacity 0.25s ease;

      z-index: 999;
    }

    .popup.show {
      opacity: 1;
    }

    .hint {
      margin-top: 14px;
      font-size: 0.9rem;
      opacity: 0.6;
    }

    @media (max-width: 480px) {

      body {
        padding: 12px;
      }

      .card {
        min-height: 72vh;
      }

      .symbol {
        font-size: 4.8rem;
      }

      .name {
        font-size: 1.7rem;
      }

      .name-zh {
        font-size: 1.35rem;
      }

      button,
      select {
        font-size: 1.05rem;
        padding: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="top-bar">
    <select id="quizMode" onchange="changeQuizMode()">
      <option value="all">All</option>
      <option value="name">Name</option>
      <option value="symbol">Symbol</option>
      <option value="Z">Z</option>
    </select>

    <select id="profileSelect" onchange="changeProfile()">
    </select>
  </div>

  <div class="container">

    <h1>Periodic Flash Cards</h1>

    <div class="card" id="card">

      <div class="atomic-number" id="Z"></div>

      <div class="mass" id="mass"></div>

      <div class="symbol" id="symbol"></div>

      <div class="name" id="name"></div>

      <a class="name-zh" id="name-zh" target="_blank" rel="noopener noreferrer"></a>

      <div class="classification" id="classification"></div>

    </div>

    <div class="buttons">
      <button onclick="previousElement()">◀ Prev</button>
      <button onclick="nextElement()">Next ▶</button>

      <button onclick="showAnswer()">Show</button>
      <button onclick="refreshDeck()">Refresh</button>
    </div>

    <div class="hint">
      Tap card to reveal • Swipe left/right to navigate
    </div>

  </div>
  <div class="popup" id="popup"></div>

       ,{ Z:  99, symbol: "Es", name: "Einsteinium",   nameZh: "锿", row: 7, classification: 8, mass: "252"   , wikiZh: "https://zh.wikipedia.org/wiki/锿" }
       ,{ Z: 100, symbol: "Fm", name: "Fermium",       nameZh: "镄", row: 7, classification: 8, mass: "257"   , wikiZh: "https://zh.wikipedia.org/wiki/镄" }
       ,{ Z: 101, symbol: "Md", name: "Mendelevium",   nameZh: "钔", row: 7, classification: 8, mass: "258"   , wikiZh: "https://zh.wikipedia.org/wiki/钔" }
       ,{ Z: 102, symbol: "No", name: "Nobelium",      nameZh: "锘", row: 7, classification: 8, mass: "259"   , wikiZh: "https://zh.wikipedia.org/wiki/锘" }
       ,{ Z: 103, symbol: "Lr", name: "Lawrencium",    nameZh: "铹", row: 7, classification: 8, mass: "266"   , wikiZh: "https://zh.wikipedia.org/wiki/铹" }
       ,{ Z: 104, symbol: "Rf", name: "Rutherfordium", nameZh: "𬬻", row: 7, classification: 2, mass: "267"   , wikiZh: "https://zh.wikipedia.org/wiki/𬬻" }
       ,{ Z: 105, symbol: "Db", name: "Dubnium",       nameZh: "𬭊", row: 7, classification: 2, mass: "268"   , wikiZh: "https://zh.wikipedia.org/wiki/𬭊" }
       ,{ Z: 106, symbol: "Sg", name: "Seaborgium",    nameZh: "𬭳", row: 7, classification: 2, mass: "269"   , wikiZh: "https://zh.wikipedia.org/wiki/𬭳" }
       ,{ Z: 107, symbol: "Bh", name: "Bohrium",       nameZh: "𬭛", row: 7, classification: 2, mass: "270"   , wikiZh: "https://zh.wikipedia.org/wiki/𬭛" }
       ,{ Z: 108, symbol: "Hs", name: "Hassium",       nameZh: "𬭶", row: 7, classification: 2, mass: "277"   , wikiZh: "https://zh.wikipedia.org/wiki/𬭶" }
       ,{ Z: 109, symbol: "Mt", name: "Meitnerium",    nameZh: "鿏", row: 7, classification: 2, mass: "278"   , wikiZh: "https://zh.wikipedia.org/wiki/鿏" }
       ,{ Z: 110, symbol: "Ds", name: "Darmstadtium",  nameZh: "𫟼", row: 7, classification: 2, mass: "281"   , wikiZh: "https://zh.wikipedia.org/wiki/𫟼" }
       ,{ Z: 111, symbol: "Rg", name: "Roentgenium",   nameZh: "𬬭", row: 7, classification: 2, mass: "282"   , wikiZh: "https://zh.wikipedia.org/wiki/𬬭" }
       ,{ Z: 112, symbol: "Cn", name: "Copernicium",   nameZh: "鿔", row: 7, classification: 2, mass: "285"   , wikiZh: "https://zh.wikipedia.org/wiki/鿔" }
       ,{ Z: 113, symbol: "Nh", name: "Nihonium",      nameZh: "鿭", row: 7, classification: 3, mass: "286"   , wikiZh: "https://zh.wikipedia.org/wiki/鿭" }
       ,{ Z: 114, symbol: "Fl", name: "Flerovium",     nameZh: "𫓧", row: 7, classification: 3, mass: "289"   , wikiZh: "https://zh.wikipedia.org/wiki/𫓧" }
       ,{ Z: 115, symbol: "Mc", name: "Moscovium",     nameZh: "镆", row: 7, classification: 3, mass: "290"   , wikiZh: "https://zh.wikipedia.org/wiki/镆" }
       ,{ Z: 116, symbol: "Lv", name: "Livermorium",   nameZh: "𫟷", row: 7, classification: 3, mass: "293"   , wikiZh: "https://zh.wikipedia.org/wiki/𫟷" }
       ,{ Z: 117, symbol: "Ts", name: "Tennessine",    nameZh: "鿬", row: 7, classification: 5, mass: "294"   , wikiZh: "https://zh.wikipedia.org/wiki/鿬" }
       ,{ Z: 118, symbol: "Og", name: "Oganesson",     nameZh: "鿫", row: 7, classification: 6, mass: "294"   , wikiZh: "https://zh.wikipedia.org/wiki/鿫" }
    ];

    const classifications = [
        { idx: 0, color: "#e2ca62", name: "Alkali metal"          }
       ,{ idx: 1, color: "#e0e35c", name: "Alkaline earth metal"  }
       ,{ idx: 2, color: "#e8c1b4", name: "Transition metal"      }
       ,{ idx: 3, color: "#a9d0df", name: "Post-transition metal" }
       ,{ idx: 4, color: "#93d1c3", name: "Metalloid"             }
       ,{ idx: 5, color: "#88dc83", name: "Reactive nonmetal"     }
       ,{ idx: 6, color: "#d4b2d8", name: "Noble gas"             }
       ,{ idx: 7, color: "#dcc89a", name: "Lanthanoid"            }
       ,{ idx: 8, color: "#e1bfd0", name: "Actinoid"              }
    ];

    // =========================================================
    // FILTER PROFILES
    // =========================================================

    const profiles = [
        { name: "Common", filter: [ {row:[1,2,3,4,5]}, {row:[6],classification:[1,2,3,4,5,6,7]}, {Z:[57,87,88,89,92,94]} ] }
       ,{ name: "Metalloid", filter: [ {classification:[4]} ] }
       ,{ name: "Transition", filter: [ {classification:[2]} ] }
       ,{ name: "All" }
    ];
    // Active filter
    let filter = profiles[0].filter;

    const elCard = document.getElementById("card")
    const elZ = document.getElementById("Z");
    const elSymbol = document.getElementById("symbol");
    const elName = document.getElementById("name");
    const elNameZh = document.getElementById("name-zh");
    const elMass = document.getElementById("mass");
    const elClassification = document.getElementById("classification");
    const elMode = document.getElementById("quizMode");
    const elProfile = document.getElementById("profileSelect");
    
    // =========================================================
    // RANDOMIZED DECK SYSTEM
    // =========================================================

    let deck = [];
    let currentIndex = 0;

    function showWarning(message) {
      //alert(message);
      const popup = document.getElementById("popup");
      popup.textContent = message;
      popup.classList.add("show");
      clearTimeout(showWarning.timeout);
      showWarning.timeout = setTimeout(() => {
        popup.classList.remove("show");
      }, 2000);
    }

    function populateProfiles() {
      elProfile.innerHTML = "";
      profiles.forEach((profile, index) => {
        const option = document.createElement("option");
        option.value = index;
        option.textContent = profile.name;
        elProfile.appendChild(option);
      });
    }

    function changeProfile() {
        const profileIndex = Number(elProfile.value);
        localStorage.setItem("periodic-profile-index", profileIndex);
        filter = profiles[profileIndex].filter;
        refreshDeck();
    }

    function changeQuizMode() {
        localStorage.setItem("periodic-quiz-mode",elMode.value);
        applyQuizMode();
    }

    function shuffle(array) {
      const arr = [...array];

      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }

      return arr;
    }

    function refreshDeck() {
      // No filter rules -> include all elements
      if (!filter || !filter.length) {
        deck = shuffle(elements);
      } else {
        deck = shuffle(
          elements.filter(element =>
            // Element matches if it matches ANY rule
            filter.some(rule =>
              // Rule matches only if ALL attributes match
              Object.entries(rule).every(
                ([key, allowedValues]) =>
                  Array.isArray(allowedValues)
                  && allowedValues.includes(element[key])
              )
            )
          )
        );
      }

      currentIndex = 0;
      if (deck.length === 0) {
        showWarning("No elements matched filter.");
        return;
      }
      renderCurrentElement();
    }

    function renderCurrentElement() {

      const element = deck[currentIndex];

      elZ.textContent = element.Z;
      elSymbol.textContent = element.symbol;
      elMass.textContent = element.mass;
      elName.textContent = element.name;
      elNameZh.textContent = element.nameZh || "";
      //elNameZh.href = element.wikiZh || "#";

      elClassification.textContent =
        classifications[element.classification].name;

      elCard.style.backgroundColor =
        classifications[element.classification].color;

      applyQuizMode();
    }

    function nextElement() {
        if (currentIndex >= deck.length - 1) {
          showWarning("Reached end of deck. Tap Refresh or reload page.");
          return;
        }
        currentIndex++;
        renderCurrentElement();
    }

    function previousElement() {
        if (currentIndex <= 0) {
          showWarning("Already at beginning of deck.");
          return;
        }
        currentIndex--;
        renderCurrentElement();
    }

    // =========================================================
    // QUIZ MODES
    // =========================================================

    function applyQuizMode() {

      const mode = elMode.value;

      if (mode === "all") {
        showAnswer();
        return;
      }

      elZ.classList.add("hidden-info");
      elSymbol.classList.add("hidden-info");
      elMass.classList.add("hidden-info");
      elName.classList.add("hidden-info");
      elNameZh.classList.add("hidden-info");
      elClassification.classList.add("hidden-info");

      if (mode === "name") {
        elName.classList.remove("hidden-info");
        elNameZh.classList.remove("hidden-info");
      }
      else if (mode === "symbol") {
        elSymbol.classList.remove("hidden-info");
      }
      else if (mode === "Z") {
        elZ.classList.remove("hidden-info");
      }
    }

    function showAnswer() {

      elZ.classList.remove("hidden-info");
      elSymbol.classList.remove("hidden-info");
      elMass.classList.remove("hidden-info");
      elName.classList.remove("hidden-info");
      elNameZh.classList.remove("hidden-info");
      elClassification.classList.remove("hidden-info");
    }

    // =========================================================
    // TAP CARD TO REVEAL
    // =========================================================

    elCard.addEventListener("click", () => {

      const mode = elMode.value;

      if (mode !== "all") {
        showAnswer();
      }
    });

    // =========================================================
    // SWIPE SUPPORT
    // =========================================================

    let touchStartX = 0;
    let touchEndX = 0;

    elCard.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    elCard.addEventListener("touchend", (e) => {

      touchEndX = e.changedTouches[0].screenX;

      const deltaX = touchEndX - touchStartX;
      const threshold = 50;

      if (Math.abs(deltaX) < threshold) {
        return;
      }

      if (deltaX < 0) {
        nextElement();
      } else {
        previousElement();
      }

    }, { passive: true });

    // =========================================================
    // INITIALIZE
    // =========================================================

    // Initialize profile dropdown
    populateProfiles();
    // Restore saved profile filter
    const savedProfileIndex = Number(localStorage.getItem("periodic-profile-index"));
    const initialProfileIndex =
      Number.isInteger(savedProfileIndex)
      && savedProfileIndex >= 0
      && savedProfileIndex < profiles.length
        ? savedProfileIndex
        : 0;
    elProfile.value = initialProfileIndex;
    filter = profiles[initialProfileIndex].filter;

    // Restore saved quiz mode
    const savedQuizMode = localStorage.getItem("periodic-quiz-mode");
    if (savedQuizMode && Array.from(elMode.options).map(opt=>opt.value).includes(savedQuizMode)) { elMode.value = savedQuizMode; }

    refreshDeck();

  </script>

</body>
