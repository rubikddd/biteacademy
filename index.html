<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Periodic Table Flash Cards</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 20px;
      background: white;
      color: black;
    }

    .top-bar {
      margin-bottom: 20px;
    }

    .container {
      max-width: 420px;
      margin: auto;
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 2rem;
    }

    .card {
      position: relative;

      border: 4px solid rgba(0,0,0,0.12);
      border-radius: 18px;

      min-height: 380px;

      padding: 24px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      transition: background-color 0.25s ease;
    }

    .atomic-number {
      position: absolute;
      top: 18px;
      left: 18px;

      font-size: 1.4rem;
      font-weight: bold;
    }

    .mass {
      position: absolute;
      top: 18px;
      right: 18px;

      font-size: 1rem;
    }

    .symbol {
      font-size: 5.5rem;
      font-weight: bold;
      line-height: 1;

      margin-bottom: 16px;
    }

    .name {
      font-size: 2rem;
    }

    .classification {
      position: absolute;
      bottom: 18px;

      font-size: 1rem;
      opacity: 0.75;

      text-transform: capitalize;
    }

    .hidden-info {
      visibility: hidden;
    }

    .buttons {
      margin-top: 20px;

      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    button,
    select {
      font-size: 1rem;
      padding: 12px;
    }

    @media (max-width: 480px) {
      .symbol {
        font-size: 4.5rem;
      }

      .name {
        font-size: 1.6rem;
      }
    }
  </style>
</head>

  <div class="top-bar">
    <select id="quizMode" onchange="showRandomElement()">
      <option value="all">All</option>
      <option value="name">Name</option>
      <option value="symbol">Symbol</option>
      <option value="Z">Atomic Number(Z)</option>
    </select>
  </div>

      <div class="name" id="name"></div>

      <div class="classification" id="classification"></div>

    </div>

    <div class="buttons">
      <button onclick="showRandomElement()">Next</button>
      <button onclick="showAnswer()">Show</button>
    </div>

    function showRandomElement() {
      const element = elements[Math.floor(Math.random() * elements.length)];

      elZ.textContent = element.Z;
      elSymbol.textContent = element.symbol;
      elName.textContent = element.name;
      elMass.textContent = element.mass;
      elClassification.textContent = classifications[element.classification].name;
      elCard.style.backgroundColor = classifications[element.classification].color;

      applyQuizMode();
    }

    function applyQuizMode() {
      const mode = document.getElementById("quizMode").value;

      // Show all first
      if (mode === "all") {
        showAnswer();
      } else {

        // Hide first and then show info according to quiz mode
        elZ.classList.add("hidden-info");
        elSymbol.classList.add("hidden-info");
        elName.classList.add("hidden-info");
        elMass.classList.add("hidden-info");
        elClassification.classList.add("hidden-info");
        if (mode === "name") {
            elName.classList.remove("hidden-info");
        } else if (mode === "symbol") {
            elSymbol.classList.remove("hidden-info");
        } else if (mode === "Z") {
            elZ.classList.remove("hidden-info");
        }
      }
    }

    function showAnswer() {
        elZ.classList.remove("hidden-info");
        elSymbol.classList.remove("hidden-info");
        elName.classList.remove("hidden-info");
        elMass.classList.remove("hidden-info");
        elClassification.classList.remove("hidden-info");
    }
